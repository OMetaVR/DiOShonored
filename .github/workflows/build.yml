name: Build

# Builds and tests the project's own code. No game files are ever available here: the iOS job produces the app *shell*
# (it boots to the "import your game files" screen); the playable app is built by each player from their own copy
# (see "Build the playable app" in the README).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publishing pre-releases on tags

jobs:
  linux:
    name: Runtime + recompiler (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang lld pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev wayland-protocols libegl1-mesa-dev libpulse-dev libasound2-dev libudev-dev libdbus-1-dev

      - name: Cache SDL3
        id: sdl
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-linux-release-3.4.14

      - name: Build SDL3
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.4.14 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX=$HOME/sdl3
          cmake --build /tmp/SDL/build
          cmake --install /tmp/SDL/build

      - name: Runtime
        run: |
          export PKG_CONFIG_PATH=$HOME/sdl3/lib/pkgconfig LD_LIBRARY_PATH=$HOME/sdl3/lib
          cmake -S runtime -B build/rt -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DDISH_USE_GENERATED=OFF
          cmake --build build/rt

      - name: Runtime tests
        run: |
          export LD_LIBRARY_PATH=$HOME/sdl3/lib
          ctest --test-dir build/rt --output-on-failure

      - name: Recompiler
        working-directory: lifter
        run: cargo build --release --locked

  ios:
    name: iOS app shell (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install ninja

      - name: Cache SDL3 (iOS)
        uses: actions/cache@v4
        with:
          path: build/ci/sdl3-ios-static
          key: sdl3-ios-static-release-3.4.14

      - name: Build
        run: ci/build_ios.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DiOShonored-shell
          path: build/DiOShonored-shell.ipa

      - name: Pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: build/DiOShonored-shell.ipa
          body_path: .github/release-notes.md
