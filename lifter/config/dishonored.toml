# Statically linked MSVC memcpy/memmove in the PhysX modules (same body as msvcr90's; found by its prologue bytes). The backward-copy
# path dispatches through `neg ecx; jmp [ecx*4+table]`, a negative-index jump table that discovery does not follow, so the lifted
# copy trapped at the first overlapping move (New Game, level load). Addresses are at the rebased module bases.
[[override]]
module = "PhysXLoader.dll"
addr = 0x10007b00
pop = 0
host = "ovr_memmove"
why = "static CRT memcpy/memmove"
[[override]]
module = "PhysXLoader.dll"
addr = 0x10009470
pop = 0
host = "ovr_memmove"
why = "static CRT memcpy/memmove"
[[override]]
module = "PhysXCore.dll"
addr = 0x1037f350
pop = 0
host = "ovr_memmove"
why = "static CRT memcpy/memmove"
[[override]]
module = "PhysXCore.dll"
addr = 0x1037f6d0
pop = 0
host = "ovr_memmove"
why = "static CRT memcpy/memmove"
[[override]]
module = "PhysXCooking.dll"
addr = 0x105698f0
pop = 0
host = "ovr_memmove"
why = "static CRT memcpy/memmove"
[[override]]
module = "PhysXCooking.dll"
addr = 0x10569c60
pop = 0
host = "ovr_memmove"
why = "static CRT memcpy/memmove"

# Statically linked _CI* math wrappers in the PhysX modules. They take their operands on the caller's x87 stack, which a lifted
# function cannot see (the lifted body trapped at its first fxch), so they become the same call-site intrinsics as msvcr90's exports.
# Identified by comparing their bytes (relocations and call displacements masked) with msvcr90's _CI* exports; rebased addresses.
[[override]]
module = "PhysXCore.dll"
addr = 0x1037ef30
host = "__builtin_acos"
kind = "x87_1"
why = "static _CIacos"
[[override]]
module = "PhysXCore.dll"
addr = 0x1037f080
host = "dish_ci_pow"
kind = "x87_2"
why = "static _CIpow"
[[override]]
module = "PhysXCore.dll"
addr = 0x10380300
host = "__builtin_asin"
kind = "x87_1"
why = "static _CIasin"
[[override]]
module = "PhysXCooking.dll"
addr = 0x1056b440
host = "__builtin_acos"
kind = "x87_1"
why = "static _CIacos"
[[override]]
module = "PhysXCooking.dll"
addr = 0x1056b680
host = "__builtin_asin"
kind = "x87_1"
why = "static _CIasin"
[[override]]
module = "PhysXCooking.dll"
addr = 0x1056b7d0
host = "dish_ci_pow"
kind = "x87_2"
why = "static _CIpow"

# Compiler float->int helpers: they take st0 from the caller, so they are lowered inline at each call site (x87 values live in the
# caller's locals). Located with tools/analysis/find_ftol.py; PhysX addresses are at the rebased module bases chosen above
# (preferred-base address + 0x100000 for PhysXCore, + 0x500000 for PhysXCooking).
[[override]]
module = "Dishonored.exe"
addr = 0x00ec3d20
host = "inline"
kind = "x87_ftol32"
why = "_ftol2_sse"
[[override]]
module = "Dishonored.exe"
addr = 0x00ec3d56
host = "inline"
kind = "x87_ftol64"
why = "_ftol2"
[[override]]
module = "msvcp90.dll"
addr = 0x784b9e30
host = "inline"
kind = "x87_ftol32"
why = "_ftol2_sse"
[[override]]
module = "msvcp90.dll"
addr = 0x784b9e66
host = "inline"
kind = "x87_ftol64"
why = "_ftol2"
[[override]]
module = "msvcr90.dll"
export = "_ftol"
host = "inline"
kind = "x87_ftol64"
[[override]]
module = "PhysXCore.dll"
addr = 0x1037fd00
host = "inline"
kind = "x87_ftol32"
why = "_ftol2_sse"
[[override]]
module = "PhysXCore.dll"
addr = 0x1037fd36
host = "inline"
kind = "x87_ftol64"
why = "_ftol2"
[[override]]
module = "PhysXCooking.dll"
addr = 0x1056aad0
host = "inline"
kind = "x87_ftol32"
why = "_ftol2_sse"
[[override]]
module = "PhysXCooking.dll"
