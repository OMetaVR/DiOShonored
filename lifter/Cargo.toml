[workspace]
resolver = "2"
members = ["ir", "lift", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "no_vex", "no_evex", "no_xop", "no_d3now"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
anyhow = "1"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 16

[profile.dev]
opt-level = 1
